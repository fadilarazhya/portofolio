<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/img/lotus.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fadila Razhya</title>
  <script>
    //NOTE: Theme initialization - add dark class if needed (no else needed since html starts without dark class)
    if (
      localStorage.getItem("color-theme") === "dark" ||
      (!("color-theme" in localStorage) &&
        window.matchMedia("(prefers-color-scheme: dark)").matches)
    ) {
      document.documentElement.classList.add("dark")
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
